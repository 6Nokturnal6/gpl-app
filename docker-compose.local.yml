version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: gpl
      POSTGRES_PASSWORD: gplpass
      POSTGRES_DB: gpl_db
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./
      dockerfile: gpl-app/backend/Dockerfile
    working_dir: /usr/src/app
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: "postgresql://gpl:gplpass@db:5432/gpl_db"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "replace-me-in-.env"
    volumes:
      - ./gpl-app/backend:/usr/src/app:cached
      - /usr/src/app/node_modules
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./
      dockerfile: gpl-app/frontend/Dockerfile
    working_dir: /usr/src/app
    environment:
      NODE_ENV: development
      REACT_APP_API_URL: "http://localhost:4000"
    volumes:
      - ./gpl-app/frontend:/usr/src/app:cached
      - /usr/src/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

  scheduler:
    build:
      context: ./
      dockerfile: gpl-app/backend/Dockerfile
    working_dir: /usr/src/app
    command: ["npm", "run", "scheduler"]
    environment:
      NODE_ENV: development
      DATABASE_URL: "postgresql://gpl:gplpass@db:5432/gpl_db"
      REDIS_URL: "redis://redis:6379"
    volumes:
      - ./gpl-app/backend:/usr/src/app:cached
      - /usr/src/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  db_data:

# Notes:
# - Provide a .env.local file next to this compose to override secrets (example: JWT_SECRET, real DB creds)
# - Backend and frontend Dockerfiles should exist at gpl-app/backend/Dockerfile and gpl-app/frontend/Dockerfile
# - Use: docker compose -f docker-compose.local.yml up --build
# - For Playwright testing, consider adding a service that runs the tests against the running stack or run tests from host with services up.
