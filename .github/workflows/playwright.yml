name: Playwright E2E

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure docker compose is available
        run: docker compose version

      - name: Start services and run Playwright via Docker Compose
        run: |
          docker compose -f gpl-app/docker-compose.yml -f gpl-app/docker-compose.playwright.yml up --build --abort-on-container-exit playwright

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: gpl-app/e2e/playwright-report

      - name: Tear down services
        if: always()
        run: docker compose -f gpl-app/docker-compose.yml -f gpl-app/docker-compose.playwright.yml down --volumes
